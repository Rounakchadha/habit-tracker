app = "habit-tracker-ottcvg"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  VAPID_SUBJECT = "mailto:rounak.chadha@finfinity.co.in"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"     # the reminder scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.alive]
      grace_period = "10s"
      interval = "30s"
      method = "GET"
      path = "/api/needs-pin"
      timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
